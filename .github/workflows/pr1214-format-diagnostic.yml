name: PR1214 Prettier diagnostic
on:
  pull_request:
  push:
    branches:
      - feat/script-marker-hint-chips
permissions:
  contents: read
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Print Prettier diff
        working-directory: frontend
        run: |
          npx prettier --write src/features/pitch/create/steps/ScriptPane.tsx
          git diff -- src/features/pitch/create/steps/ScriptPane.tsx
          npx prettier --check src/features/pitch/create/steps/ScriptPane.tsx
