# 백엔드 PR 검사: 마이그레이션 · ruff · 앱 import · pytest.
#
# ── 왜 이것부터인가 ───────────────────────────────────────────────────
#
# 두 사람이 각자 브랜치에서 마이그레이션을 만들어 머지하면 head 가 둘이 되고,
# 그때부터 `alembic upgrade head` 가 "Multiple head revisions are present" 로
# 죽습니다. 죽는 곳은 PR 이 아니라 **배포**라, 먼저 받은 사람만 모르고 지나갑니다.
# 실제로 PR #32 리뷰에서 같은 지적을 받고도 develop 에 head 2개가 남아 있었습니다.
#
# 엔티티만 고치고 마이그레이션을 빠뜨리는 것도 같은 종류입니다. 그래서 job 하나에서
# 아래를 순서대로 검사합니다. 빠른 것(DB 불필요)을 앞에 둬서 실패를 일찍 알립니다.
#
#   - alembic head 개수
#   - ruff check src
#   - 앱 import. 지워진 이름을 import 한 채로 머지돼 develop·main 이 기동조차 못 한 적이
#     있습니다 (PR #69). 이 검사가 그때 있었으면 PR 에서 막혔습니다.
#   - 빈 DB 에 마이그레이션 적용 + alembic check (엔티티와 마이그레이션이 같은지)
#   - pytest. PostgreSQL·Redis 는 아래 services 컨테이너를 쓴다
#
# ★ 이 파일만으로는 게이트가 아닙니다. Settings → Branches → 브랜치 보호에서
#   `backend` 를 Require status checks 에 넣어야 실패한 PR 이 막힙니다.
#   job 이름이 `check` 가 아니라 `backend` 인 이유도 그것입니다 (frontend-ci.yml 과 같은 규칙).
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    # 기본값은 360분이다. WebSocket·asyncio 테스트가 멈추면 그만큼 실행 시간을 잡아먹는다
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    # job 하나로 두는 이유: 브랜치 보호의 필수 체크를 `backend` 하나로 유지하려고.
    # healthcheck 가 없으면 DB 가 뜨기 전에 단계가 시작돼 가끔 연결 실패가 난다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Settings 가 요구하는 필수 값. DATABASE_URL 은 위 postgres 서비스를 가리킨다.
    # 마이그레이션 검사는 이 ci DB 를, pytest 는 conftest 가 만드는 ci_test DB 를 쓴다.
    # REDIS_URL 은 기본값(localhost:6379)이 서비스와 맞아 넣지 않는다.
    # 나머지는 형식만 맞으면 된다 — 외부 호출은 테스트에서 모킹한다.
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      JWT_SECRET_KEY: ci-dummy-jwt-secret-at-least-32-bytes
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      DEEPGRAM_API_KEY: ci-dummy
      S3_BUCKET_NAME: ci-dummy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked

      - name: Alembic head 는 하나여야 합니다
        run: |
          heads=$(uv run alembic heads | grep -c '(head)')
          echo "head 개수: $heads"
          uv run alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::head 가 $heads 개입니다. 'uv run alembic merge -m \"...\" <head1> <head2>' 로 합친 뒤 다시 올려 주세요."
            exit 1
          fi

      - name: ruff 검사
        run: uv run ruff check src

      - name: 앱이 import 되어야 합니다
        run: uv run python -c "import pitch_coach_backend.main"

      - name: 마이그레이션이 빈 DB 에 적용되고 엔티티와 같아야 합니다
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: 테스트
        run: uv run pytest -q
