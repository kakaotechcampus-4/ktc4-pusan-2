# ══════════════════════════════════════════════════════════════════════
#  ★★ 이 파일은 **모노레포 루트**의 .github/workflows/ 에 있어야 동작합니다 ★★
#
#  GitHub 는 레포 **루트**의 .github/workflows/ 만 읽습니다.
#  subtree 로 이 폴더가 frontend/ 에 들어가면 이 파일은
#  frontend/.github/workflows/ci.yml 이 되어 **아무 일도 하지 않습니다.**
#  에러도 안 납니다 — 그냥 CI 가 없는 상태가 됩니다.
#
#  옮기세요:
#    cp frontend/.github/workflows/ci.yml .github/workflows/frontend-ci.yml
#
#  아래 경로는 이미 모노레포(frontend/) 기준으로 맞춰 뒀습니다.
# ══════════════════════════════════════════════════════════════════════
#
# SETUP §S7 의 네 게이트를 PR 통과 조건으로 강제합니다.
#
# ★ 이 파일만으로는 아직 게이트가 아닙니다. GitHub 에서
#   Settings → Branches → 브랜치 보호 → Require status checks to pass
#   에서 `frontend` 를 골라야 실패한 PR 이 막힙니다.
#
#   job 이름을 `check` 가 아니라 `frontend` 로 둔 이유 —
#   모노레포에는 백엔드 워크플로도 있습니다. 둘 다 job 이름이 `check` 면
#   브랜치 보호에서 어느 것인지 구분되지 않습니다.
name: Frontend CI

on:
  push:
    branches: [main, develop, release, develop-next]
    # 백엔드만 바뀐 푸시에 프론트 CI 를 돌리지 않습니다.
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'docs/ai/features/script-parser-markers.json'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'docs/ai/features/script-parser-markers.json'

jobs:
  frontend:
    runs-on: ubuntu-latest

    # 모든 run 스텝을 frontend/ 에서 실행합니다.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # .nvmrc 를 읽습니다 — 버전 숫자를 여기 또 적으면 두 곳이 갈립니다.
      # frontend/.npmrc 의 engine-strict=true 가 package.json 의 engines(>=24)와 대조합니다.
      #
      # ★ with: 의 경로는 working-directory 를 따르지 않습니다. 레포 루트 기준입니다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm install 이 아니라 npm ci 입니다. lock 을 그대로 재현해야
      # "제 컴퓨터에서는 되는데요"가 CI 에서 걸립니다.
      - run: npm ci

      # SETUP §S7 의 넷. 하나라도 실패하면 머지하지 않습니다.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run format:check

      # 타입 체크와 별개로 실제 번들이 되는지까지 봅니다.
      # alias·워커·Tailwind 는 빌드에서만 드러나는 문제가 있습니다.
      # (워커가 컴파일 안 된 .ts 로 떨어지던 사고가 실제로 있었습니다)
      - run: npm run build

      # 헤더 오타는 에러를 내지 않습니다. 몇 주 뒤 MediaPipe 를 붙일 때
      # SharedArrayBuffer 로 터지고, 그때는 원인을 못 찾습니다.
      # dev 와 preview 양쪽을 봅니다 — preview 만 빠지는 일이 실제로 있었습니다.
      - name: COOP/COEP 헤더 (dev · preview 양쪽)
        run: |
          set -euo pipefail
          check() {
            local name=$1 url=$2
            for _ in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url" 2>/dev/null; then break; fi
              sleep 1
            done
            local headers
            headers=$(curl -fsSI "$url")
            echo "$headers" | grep -qi '^cross-origin-opener-policy: same-origin' \
              || { echo "::error::$name 에 COOP 없음"; echo "$headers"; exit 1; }
            echo "$headers" | grep -qi '^cross-origin-embedder-policy:' \
              || { echo "::error::$name 에 COEP 없음"; echo "$headers"; exit 1; }
            echo "$name OK"
          }

          # 포트를 여기 적지 않습니다 — vite.config.ts 의 server.port/preview.port
          # 를 그대로 씁니다. 두 곳에 적으면 한쪽만 바뀌어 조용히 갈라집니다.
          npm run dev &
          dev_pid=$!
          check dev http://localhost:3000/
          kill $dev_pid

          npm run preview &
          prev_pid=$!
          check preview http://localhost:3001/
          kill $prev_pid

  # 브라우저로 화면을 끝까지 돌리는 E2E 시험(Playwright)입니다. 단위 시험(vitest)만으로는
  # 여러 화면 · 단계에 걸친 동작이 잡히지 않아서 PR 마다 돌립니다 (#1134).
  # 목 서버(MSW) 위에서 돌아 BE · 비밀값이 필요 없고, 개발 서버는 playwright.config.ts 의
  # webServer 가 3100 포트로 직접 띄웁니다.
  #
  # `frontend` 와 job 을 나눈 이유 — 시험이 몇 분 걸려서 `frontend` 결과를 늦추지 않게,
  # 그리고 위 COOP/COEP 검사가 쓰는 3000 · 3001 포트와 엮이지 않게 했습니다.
  #
  # 브랜치 보호의 필수 검사에는 아직 넣지 않았습니다. 몇 주 돌려 보고 흔들리지 않으면
  # FE 와 함께 정합니다.
  frontend-e2e:
    runs-on: ubuntu-latest
    # 기본값은 360분입니다. 개발 서버나 브라우저가 멈추면 그만큼 실행 시간을 잡아먹습니다.
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # 위 `frontend` 와 같은 Node 설정입니다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # package-lock 의 @playwright/test 버전에 맞는 Chromium 과 리눅스 의존 패키지를 받습니다.
      # 시험은 Chromium 하나로만 돕니다 (playwright.config.ts 의 projects).
      - run: npx playwright install --with-deps chromium

      # GitHub 가 CI=true 를 두면 설정이 바뀝니다 — 실패한 시험을 한 번 더 돌리고(retries: 1),
      # test.only 가 남아 있으면 실패하고, HTML 리포트를 playwright-report/ 에 남깁니다.
      - run: npm run test:e2e

      # 실패했을 때만 리포트와 trace(test-results/)를 올립니다.
      # ★ with: 의 경로는 working-directory 를 따르지 않습니다. 레포 루트 기준입니다.
      # v4 는 같은 실행에 같은 이름의 artifact 가 있으면 409 로 실패할 수 있어서,
      # 실패한 job 을 다시 실행해도 겹치지 않게 이름에 시도 번호를 붙입니다.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  design-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/fe/design
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: docs/fe/design/.nvmrc
          cache: npm
          cache-dependency-path: docs/fe/design/package-lock.json
      - run: npm ci
      - run: |
          out=$(npm run --silent drift -- HEAD)
          echo "$out"
          {
            echo '### 화면 설계서 대조'
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
