name: Design CI

on:
  push:
    branches: [main, develop, release, develop-next]
    paths:
      - 'docs/fe/design/**'
      - '.github/workflows/design-ci.yml'
  pull_request:
    paths:
      - 'docs/fe/design/**'
      - '.github/workflows/design-ci.yml'

# 같은 PR 에 새로 푸시하면 아직 돌거나 기다리는 이전 실행을 취소합니다 (#1205).
# frontend-ci.yml 과 같은 방식입니다. push 는 실행마다 다른 그룹(run_id)이라 서로 기다리거나 취소되지 않습니다.
# Pages 배포가 한 번에 하나만 도는 건 아래 deploy job 의 design-pages 그룹이 따로 맡습니다.
concurrency:
  group: design-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  design:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/fe/design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: docs/fe/design/.nvmrc
          cache: npm
          cache-dependency-path: docs/fe/design/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run format:check
      - run: npm run build -- --base=/ktc4-pusan-2/
      - if: github.event_name == 'push' && github.ref == 'refs/heads/develop-next'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/fe/design/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop-next'
    needs: design
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: design-pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
