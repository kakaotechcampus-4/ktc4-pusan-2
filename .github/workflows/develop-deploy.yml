name: Deploy develop

on:
  push:
    branches: [develop-next]
  workflow_dispatch:

concurrency:
  group: ktc-server-deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC로 AWS 역할을 맡기 위해 필요
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      # caddy : develop의 경우 8080
      FILES: -f docker-compose.yml -f docker-compose.dev.yml
      # EC2가 있는 리전과 다르면 반드시 수정
      AWS_REGION: ap-northeast-2
      # ~/.ssh/config 에 만들 별칭. 아래 ssh/scp 호출이 모두 이 이름을 씀
      SSH_HOST: ktc-server
      REMOTE_DIR: pitch-coach

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Resolve image repo
        run: |
          set -euo pipefail
          echo "IMAGE_REPO=${{ steps.ecr.outputs.registry }}/pitch-coach" >> "$GITHUB_ENV"

      - name: Ensure ECR repository
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names pitch-coach --region "$AWS_REGION" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name pitch-coach --region "$AWS_REGION" >/dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Stub env files
        run: touch backend/.env frontend/.env ai/.env

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: alembic revision
        working-directory: backend
        run: |
          uv run alembic-git-revisions alembic/versions

      - name: Build & push
        working-directory: infra
        run: |
          docker compose $FILES build be fe ai
          docker compose $FILES push be fe ai

      # ── 여기부터 EC2 접속 (22번 포트 대신 SSM 터널 사용) ──

      - name: Install session-manager-plugin
        run: |
          curl -fsSL -o /tmp/session-manager-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - name: Configure SSH over SSM
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_KEYPAIR_ID: ${{ secrets.EC2_KEYPAIR_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # 개인키는 GitHub Secret이 아니라 파라미터 스토어에서 런타임에 받아온다
          aws ssm get-parameter \
            --name "/ec2/keypair/$EC2_KEYPAIR_ID" \
            --with-decryption \
            --query Parameter.Value \
            --output text > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat >> ~/.ssh/config <<EOF
          Host $SSH_HOST
            HostName $EC2_INSTANCE_ID
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"
          EOF
          chmod 600 ~/.ssh/config

          ssh "$SSH_HOST" 'echo SSM SSH OK: $(hostname)'

      - name: Copy compose files to EC2
        run: |
          set -euo pipefail
          tar -czf - -C infra . \
            | ssh "$SSH_HOST" "mkdir -p ~/$REMOTE_DIR/infra && tar -xzf - -C ~/$REMOTE_DIR/infra"

      - name: Write env files on EC2
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
          AI_ENV: ${{ secrets.AI_ENV }}
        run: |
          set -euo pipefail
          # docker-compose.yml 의 env_file 경로(../backend/.env) 복원.
          # 시크릿은 stdin으로만 넘겨서 원격 셸이 내용을 파싱하지 않게 한다.
          ssh "$SSH_HOST" "mkdir -p ~/$REMOTE_DIR/backend ~/$REMOTE_DIR/frontend ~/$REMOTE_DIR/ai"

          printf '%s' "$BACKEND_ENV" \
            | ssh "$SSH_HOST" "cat > ~/$REMOTE_DIR/backend/.env"
          printf '%s' "$FRONTEND_ENV" \
            | ssh "$SSH_HOST" "cat > ~/$REMOTE_DIR/frontend/.env"
          printf '%s' "$AI_ENV" | ssh "$SSH_HOST" "cat > ~/$REMOTE_DIR/ai/.env"

          printf 'IMAGE_REPO=%s\nIMAGE_TAG=%s\n' "$IMAGE_REPO" "$IMAGE_TAG" \
            | ssh "$SSH_HOST" "cat > ~/$REMOTE_DIR/infra/.env"

      - name: Pull & up on EC2
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | ssh "$SSH_HOST" "docker login --username AWS --password-stdin '${IMAGE_REPO%%/*}'"

          ssh "$SSH_HOST" "REMOTE_DIR=$REMOTE_DIR bash -se" <<'SCRIPT'
          set -euo pipefail
          cd ~/"$REMOTE_DIR"/infra

          FILES="-f docker-compose.yml -f docker-compose.dev.yml"
          # 이미지를 배포마다 커밋 태그(be-<sha> 등)로 받아서, -a 없는 prune 은 옛 이미지를 지우지 못해
          # 디스크가 찬다. 받기 전에 컨테이너가 쓰지 않는 이미지를 모두 지운다. 지금 도는 컨테이너의
          # 이미지는 남는다. 되돌릴 때는 ECR 에서 다시 받는다
          docker image prune -af
          df -h /
          docker compose $FILES pull
          docker network inspect edge >/dev/null 2>&1 || docker network create edge
          docker compose $FILES run --rm -T be alembic upgrade head < /dev/null
          docker compose $FILES up -d --no-build --remove-orphans
          # 방금 내려간 이전 버전 이미지
          docker image prune -af
          docker system df
          SCRIPT

      - name: Close SSM tunnel
        if: always()
        run: ssh -O exit "$SSH_HOST" 2>/dev/null || true
