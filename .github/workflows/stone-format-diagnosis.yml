name: Temporary stone contrast format diagnosis
on:
  push:
    branches: ['fix/fe-stone-contrast-838']
    paths:
      - '.github/workflows/stone-format-diagnosis.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/shared/lib/stoneContrast.test.ts
          git diff -- src/shared/lib/stoneContrast.test.ts
