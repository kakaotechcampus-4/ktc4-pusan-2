<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="device-title device-desc">
<title id="device-title">시작 전 장치 점검 화면 설명용 목업</title>
<desc id="device-desc">제품의 시작 전 세팅을 단순화한 예시입니다. 피치 제목과 TAKE 배지, 카메라와 음량, 장비 준비 네 항목, 이번 Take 미션, 발표 중 대본 표시 선택, 오른쪽 시작 버튼과 왼쪽 아래 채팅 런처가 있습니다. 실제 사용자 정보는 없습니다.</desc>
<g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">
