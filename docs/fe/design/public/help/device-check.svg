<text x="986" y="438" font-size="13" fill="#6b625b" font-weight="500" text-anchor="end">시작 후 변경 불가</text>
<rect x="535" y="451" width="187" height="33" rx="0" fill="#2a2723" stroke="#2a2723" stroke-width="1"/>
<text x="628" y="473" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">전체 대본 + 하이라이트</text>
<rect x="729" y="451" width="112" height="33" rx="0" fill="#f5f0e9" stroke="#c6bcac" stroke-width="1"/>
