<!doctype html>
<!--
  Google OAuth 수동 테스트 페이지 (개발 전용).

  프론트엔드가 아직 없는 동안 로그인 흐름 전체를 브라우저에서 확인하려고 만들었다.
  프론트 연동 계약(쿠키·CSRF·메모리 보관)을 실행 가능한 형태로 남긴 참조 구현이기도 하다.

  **앱이 이 파일을 서빙하지 않는다.** main.py 에 StaticFiles 로 붙이지 말 것.
  디버그 페이지가 운영에 나가는 사고의 전형이다. 정적 서버로 따로 띄워서 쓴다.

  필요한 것

    - PostgreSQL 과 Redis 가 떠 있어야 한다
    - backend/.env 에 GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET 이 있어야 한다.
      비밀값이라 저장소에 없다. 팀에서 받거나 Google Console 에서 직접 발급한다
      (.env.example 이 키 목록이다)
    - Google Console 의 승인된 리디렉션 URI 에 아래가 등록돼 있어야 한다
      http://localhost:8000/api/auth/google/callback

  실행

      brew services start postgresql@17     # 안 떠 있으면
      brew services start redis

      cd backend
      uv sync
      uv run alembic upgrade head

      uv run uvicorn pitch_coach_backend.main:app --port 8000    # 터미널 1
      python3 -m http.server 3000 --directory dev                # 터미널 2
      open http://localhost:3000/oauth-test.html

  백엔드 포트가 다르면 ?api=http://localhost:9000 으로 붙이거나 화면에서 바꾼다.

  Redis 가 없으면 서버는 뜨고 /api/health 도 200 이지만 1번 버튼에서 500 이 난다.
  응답에는 원인이 안 나오므로 그때는 서버 로그를 본다 (ConnectionError 가 찍힌다).

  주의: 이 페이지와 백엔드가 **같은 호스트**여야 한다 (쿠키는 포트를 무시하고
  호스트로만 구분된다). localhost 와 127.0.0.1 을 섞으면 csrf_token 을 읽지 못한다.
-->
<meta charset="utf-8">
<title>OAuth 로컬 테스트</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         max-width: 820px; margin: 32px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { opacity: .65; margin-bottom: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  button { font: inherit; padding: 8px 14px; border: 1px solid #8886; border-radius: 6px;
           background: #8881; cursor: pointer; }
  button:hover { background: #8883; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  input { font: inherit; padding: 6px 10px; border: 1px solid #8886; border-radius: 6px;
          background: transparent; color: inherit; width: 260px; }
  .state { border: 1px solid #8884; border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
  .state div { display: flex; gap: 10px; padding: 2px 0; align-items: center; }
  .state b { min-width: 130px; font-weight: 600; opacity: .7; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #log { border: 1px solid #8884; border-radius: 8px; padding: 14px 16px; min-height: 200px;
         white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         font-size: 12.5px; line-height: 1.7;
         /* JWT 는 공백이 없어 pre-wrap 만으로는 안 끊긴다 */
         overflow-wrap: anywhere; }
  .ok { color: #1a7f37; } .bad { color: #cf222e; } .dim { opacity: .55; }
  @media (prefers-color-scheme: dark) { .ok { color: #3fb950; } .bad { color: #f85149; } }
</style>

<h1>Google OAuth 로컬 테스트</h1>
<div class="sub">개발 전용. 프론트엔드가 생기면 이 파일은 지운다.</div>

<div class="state">
  <div><b>백엔드 주소</b><input id="api" spellcheck="false"><span class="dim">쿠키 공유를 위해 이 페이지와 호스트가 같아야 한다</span></div>
  <div><b>csrf_token 쿠키</b><span id="s-csrf">-</span></div>
  <div><b>access token</b><span id="s-access">없음</span></div>
  <div><b>남은 시간</b><span id="s-exp">-</span></div>
</div>

<div class="row">
  <button class="primary" onclick="login()">1. 구글 로그인</button>
  <button onclick="refresh()">2. 토큰 갱신</button>
  <button onclick="me()">3. 내 정보</button>
  <button onclick="refreshNoCsrf()">4. CSRF 없이 갱신 (401 기대)</button>
  <button onclick="me(true)">5. 토큰 없이 내 정보 (401 기대)</button>
  <button onclick="logout()">6. 로그아웃</button>
  <button onclick="document.getElementById('log').textContent = ''">지우기</button>
</div>

<div id="log"></div>

<script>
const DEFAULT_API = 'http://localhost:8000'
const apiInput = document.getElementById('api')
const log = document.getElementById('log')
let accessToken = null, expiresAt = null

// 우선순위: ?api= 쿼리 > 저장값 > 기본값
apiInput.value = new URLSearchParams(location.search).get('api')
  || localStorage.getItem('oauth-test-api') || DEFAULT_API
apiInput.onchange = () => localStorage.setItem('oauth-test-api', api())

const api = () => apiInput.value.replace(/\/$/, '')
const csrf = () => document.cookie.split('; ').find(c => c.startsWith('csrf_token='))?.split('=')[1]

function say(msg, cls = '') {
  const t = new Date().toLocaleTimeString('ko-KR', { hour12: false })
  const line = document.createElement('div')
  if (cls) line.className = cls
  line.textContent = `[${t}] ${msg}`
  log.appendChild(line)
  log.scrollTop = log.scrollHeight
}

function paint() {
  const c = csrf()
  document.getElementById('s-csrf').innerHTML = c
    ? `<span class="ok">있음</span> <span class="dim">${c.slice(0, 12)}…</span>`
    : '<span class="bad">없음 (로그인 안 됨)</span>'
  document.getElementById('s-access').innerHTML = accessToken
    ? `<span class="ok">있음</span> <span class="dim">${accessToken.slice(0, 24)}…</span>`
    : '<span class="dim">없음 — 메모리에만 보관하므로 새로고침하면 사라진다</span>'
  const left = expiresAt ? Math.round((expiresAt - Date.now()) / 1000) : null
  document.getElementById('s-exp').textContent =
    left === null ? '-' : left > 0 ? `${left}초` : '만료됨'
}
setInterval(paint, 1000)

function login() {
  say('→ /api/auth/google/start 로 이동한다 (fetch 가 아니라 페이지 이동이다)')
  location.href = `${api()}/api/auth/google/start?return_to=/oauth-test.html`
}

async function call(path, opts = {}, label = path) {
  try {
    // credentials: 'include' 가 없으면 cross-origin 요청에 쿠키가 실리지 않는다.
    const res = await fetch(api() + path, { credentials: 'include', ...opts })
    const body = await res.text()
    let parsed; try { parsed = JSON.parse(body) } catch { parsed = body }
    say(`${label} → ${res.status}`, res.ok ? 'ok' : 'bad')
    say('   ' + JSON.stringify(shorten(parsed)), 'dim')
    return { res, parsed }
  } catch (e) {
    say(`${label} → 요청 실패: ${e.message}`, 'bad')
    say('   백엔드가 안 떠 있거나 CORS 가 막혔다', 'dim')
    return {}
  }
}

// 900자짜리 JWT 를 로그에 통째로 찍으면 나머지가 안 보인다. 값만 줄인다.
function shorten(value, max = 40) {
  if (typeof value === 'string') return value.length > max ? value.slice(0, max) + '…' : value
  if (Array.isArray(value)) return value.map(v => shorten(v, max))
  if (value && typeof value === 'object')
    return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, shorten(v, max)]))
  return value
}

function expect(res, status, note) {
  if (!res) return
  say(res.status === status ? `   기대대로 ${status} 다` : `   ${status} 가 아니다 — ${note}`,
      res.status === status ? 'ok' : 'bad')
}

async function refresh() {
  const token = csrf()
  if (!token) return say('csrf_token 쿠키가 없다. 먼저 1번으로 로그인한다.', 'bad')
  const { res, parsed } = await call('/api/auth/refresh',
    { method: 'POST', headers: { 'X-CSRF-Token': token } }, 'POST /api/auth/refresh')
  if (res?.ok) {
    accessToken = parsed.access_token
    expiresAt = Date.now() + parsed.expires_in * 1000
    say(`   access token 을 메모리에 보관했다 (${parsed.expires_in}초). Refresh 는 회전됐다.`, 'dim')
    paint()
  }
}

async function refreshNoCsrf() {
  const { res } = await call('/api/auth/refresh', { method: 'POST' },
    'POST /api/auth/refresh (CSRF 헤더 없이)')
  expect(res, 401, '쿠키만으로 통과하면 다른 사이트가 갱신을 호출할 수 있다')
}

async function me(noToken = false) {
  const headers = noToken || !accessToken ? {} : { Authorization: `Bearer ${accessToken}` }
  const label = noToken ? 'GET /api/users/me (토큰 없이)' : 'GET /api/users/me'
  const { res } = await call('/api/users/me', { headers }, label)
  if (noToken) expect(res, 401, '도메인 API 는 Access JWT 로만 인증해야 한다')
}

async function logout() {
  const token = csrf()
  if (!token) return say('csrf_token 쿠키가 없다.', 'bad')
  await call('/api/auth/logout', { method: 'POST', headers: { 'X-CSRF-Token': token } },
             'POST /api/auth/logout')
  accessToken = null; expiresAt = null
  paint()
  // 쿠키가 지워져서 2번을 눌러도 요청이 나가지 않는다. 서버가 실제로 폐기했는지는
  // 훔친 쿠키를 되돌려 보내야 확인되는데, HttpOnly 라 브라우저에서는 못 한다.
  // tests/test_auth_endpoints.py 의 test_refresh_after_logout_is_rejected 가 그걸 검증한다.
  say('   쿠키 두 개가 지워졌다. 다시 쓰려면 1번으로 로그인한다.', 'dim')
  say('   이 세션의 Refresh 는 서버에서도 폐기됐다 (다른 기기 세션은 그대로다).', 'dim')
}

// 콜백에서 막 돌아온 상황이면 바로 갱신한다 — 실제 프론트가 할 동작이다.
paint()
if (csrf()) {
  say('csrf_token 쿠키가 보인다. 로그인 직후로 보고 갱신을 시도한다.', 'dim')
  refresh()
} else {
  say('1번 버튼으로 시작한다.', 'dim')
}
</script>
