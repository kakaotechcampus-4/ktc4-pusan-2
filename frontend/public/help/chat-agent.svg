<text x="101" y="187" font-size="15" fill="#2a2723" font-weight="700">범위: 전체 ▾</text>
<text x="284" y="185" font-size="14" fill="#6b625b">기억 없이 대화하기</text>
<rect x="437" y="169" width="35" height="20" rx="10" fill="#6b625b"/>
<circle cx="447" cy="179" r="8" fill="#fff"/>
<line x1="70" y1="202" x2="480" y2="202" stroke="#c6bcac"/>
<circle cx="275" cy="229" r="20" fill="#ffe2bf" stroke="#c6bcac"/>
<text x="275" y="236" font-size="23" font-weight="800" text-anchor="middle" fill="#c9421c">S</text>
<text x="275" y="265" font-size="19" text-anchor="middle" font-weight="800" fill="#2a2723">새미나이에게 물어보세요</text>
<text x="275" y="285" font-size="13" text-anchor="middle" fill="#6b625b">발표 기록을 분석하고 다음 연습을 준비해요</text>
<text x="91" y="315" font-size="16" font-weight="800" fill="#2a2723">이런 걸 도와드릴 수 있어요</text>
<g font-size="14" fill="#6b625b">
<text x="96" y="339">• 내 연습 기록에서 고칠 점 찾기</text>
<text x="96" y="361">• Take끼리 비교하기</text>
<text x="96" y="383">• 다음 연습 목표 잡기</text>
<text x="96" y="405">• 발표법 · 화면 사용법 안내</text>
</g>
