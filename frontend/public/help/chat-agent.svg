<rect x="550" y="75" width="456" height="474" fill="#fff" stroke="#c6bcac" stroke-width="2"/>
<g><circle cx="574" cy="116" r="18" fill="#c9421c"/><text x="574" y="122" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text><text x="607" y="115" font-size="19" font-weight="800" fill="#2a2723">채팅 열기</text><text x="607" y="142" font-size="15" fill="#6b625b">왼쪽 아래 버튼 · 발표 중에는 숨김</text></g>
<g><circle cx="574" cy="189" r="18" fill="#c9421c"/><text x="574" y="195" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text><text x="607" y="188" font-size="19" font-weight="800" fill="#2a2723">대화 관리</text><text x="607" y="215" font-size="15" fill="#6b625b">새 대화 · 대화 목록 · 기억 설정 · 닫기</text></g>
<g><circle cx="574" cy="262" r="18" fill="#c9421c"/><text x="574" y="268" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text><text x="607" y="261" font-size="19" font-weight="800" fill="#2a2723">대화 범위</text><text x="607" y="288" font-size="15" fill="#6b625b">전체 또는 특정 피치를 선택해 질문</text></g>
<g><circle cx="574" cy="335" r="18" fill="#c9421c"/><text x="574" y="341" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4</text><text x="607" y="334" font-size="19" font-weight="800" fill="#2a2723">기억 없이 대화하기</text><text x="607" y="361" font-size="15" fill="#6b625b">새 대화 첫 메시지를 보내기 전 선택</text></g>
<g><circle cx="574" cy="408" r="18" fill="#c9421c"/><text x="574" y="414" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">5</text><text x="607" y="407" font-size="19" font-weight="800" fill="#2a2723">질문 예시</text><text x="607" y="434" font-size="15" fill="#6b625b">누르면 해당 질문을 바로 전송</text></g>
<g><circle cx="574" cy="481" r="18" fill="#c9421c"/><text x="574" y="487" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">6</text><text x="607" y="480" font-size="19" font-weight="800" fill="#2a2723">메시지 입력</text><text x="607" y="507" font-size="15" fill="#6b625b">직접 질문을 작성해 전송</text></g>
<text x="34" y="584" font-size="14" fill="#6b625b">설명용 목업 · 실제 기록/개인정보 없음 · 실제 답변 범위는 서비스 상태에 따라 달라질 수 있음</text>
