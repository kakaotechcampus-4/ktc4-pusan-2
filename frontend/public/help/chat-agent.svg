<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="chat-title chat-desc">
<title id="chat-title">새미나이 채팅 화면 설명용 목업</title>
<desc id="chat-desc">지원되는 화면의 왼쪽 아래에 나타나는 채팅 버튼과 새미나이 패널의 새 대화, 대화 목록, 기억 설정, 대화 범위, 기억 없이 대화하기, 질문 예시, 메시지 입력을 번호 1부터 6까지 설명합니다. 실제 사용자 기록은 없습니다.</desc>
<g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">
