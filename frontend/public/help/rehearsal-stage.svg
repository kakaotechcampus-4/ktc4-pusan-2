<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="stage-title stage-desc">
<title id="stage-title">발표 연습 화면 설명용 목업</title>
<desc id="stage-desc">제품의 리허설 화면 배치를 기준으로 만든 예시입니다. 1 슬라이드, 2 카메라, 3 마이크 음량, 4 피코 코치, 5 대본, 6 키보드 조작, 7 발표 끝내기 버튼. 실제 사용자 영상과 발표 자료를 포함하지 않습니다.</desc>
