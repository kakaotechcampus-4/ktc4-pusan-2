[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 배포 이름. import 패키지는 coach_lab(research 전용 재생 · 실험 도구) 하나다.
# 판단 코어는 AI 서비스(ai/service)의 pitch_coach_ai.features.coach 에 있고, 서비스를 editable 로 설치해
# 그대로 import 한다(원본은 서비스 한 곳)
name = "coach-agent"
version = "1.0.0"
description = "Pitch Coach realtime coach agent - research (core + lab)"
# service 가 쓸 Python 버전(3.12)에서 검증한다
requires-python = ">=3.12"
dependencies = [
    # ── 코어: 서비스 패키지가 가져온다(pydantic 포함). 판은 서비스 uv.lock 과 같게 맞춘다
    "pitch-coach-ai",
    # ── research 전용 (coach_lab 의 코칭 계획 실험 plan_eval · llm). 재생 · 리뷰 근거 실험은 쓰지 않는다
    "langchain-openai>=1.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.uv.sources]
pitch-coach-ai = { path = "../../service", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["coach_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live: 실제 LLM API 를 부르는 테스트 (과금). 기본 실행에서 빼고 `pytest -m live` 로 따로 돌린다
markers = ["live: 실제 LLM API 를 호출한다 (과금)"]
addopts = "-m 'not live'"

# backend/pyproject.toml 과 같은 규칙
[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pitch_coach_ai", "coach_lab"]
