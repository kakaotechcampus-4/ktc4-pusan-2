[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 배포 이름. import 패키지는 coverage_lab(research 전용 실험 도구) 하나다.
# 코어는 AI 서비스(ai/service)의 pitch_coach_ai.features.script_coverage 에 있고, 서비스를 editable 로
# 설치해 그대로 import 한다(코어 원본은 서비스 한 곳). 코어를 고칠 때는 서비스에서 고친다
name = "script-coverage-evaluation"
version = "1.0.0"
description = "Pitch Coach script coverage evaluation - research (core + lab)"
# service 가 쓸 Python 버전(3.12)에서 검증한다
requires-python = ">=3.12"
dependencies = [
    # ── 코어: 서비스 패키지가 코어 의존성(pydantic · kiwipiepy · scikit-learn)을 함께 가져온다.
    #    판은 서비스 uv.lock 과 같게 맞춘다(scikit-learn 을 올릴 때는 캐시 재생 비교로 평가 기준이 같은지 먼저 확인)
    "pitch-coach-ai",
    # ── research 전용 (coverage_lab · experiments · reports)
    "langchain-openai>=1.3",
    "python-dotenv>=1.0",
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
    "ipykernel",
    "nbconvert",
]

[tool.uv.sources]
pitch-coach-ai = { path = "../../service", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live: 실제 LLM API 를 부르는 테스트 (과금). 기본 실행에서 빼고 `pytest -m live` 로 따로 돌린다
markers = ["live: 실제 LLM API 를 호출한다 (과금)"]
addopts = "-m 'not live'"

# backend/pyproject.toml 과 같은 규칙
[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 코드 줄 길이는 ruff format 이 맞춘다. 남는 긴 줄은 한국어 주석 · 문자열(한글은 폭 2칸)이고,
# 프롬프트 · LLM 출력 스키마의 문자열은 캐시 키(설정 해시)에 들어가 원문 그대로 둬야 해서 E501 은 끈다
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pitch_coach_ai", "coverage_lab"]
