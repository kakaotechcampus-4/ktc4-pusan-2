[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 배포 이름. import 패키지는 두 개다.
#   script_coverage — 코어. 나중에 ai/service 의 features/script_coverage/ 로 폴더째 옮긴다
#   coverage_lab    — research 전용 실험 도구. 옮기지 않는다
name = "script-coverage-evaluation"
version = "1.0.0"
description = "Pitch Coach script coverage evaluation - research (core + lab)"
# service 가 쓸 Python 버전(3.12)에서 검증한다
requires-python = ">=3.12"
dependencies = [
    # ── 코어(script_coverage)가 쓰는 것. service 로 옮길 때 이 목록만 가져간다
    "pydantic>=2.13",
    "kiwipiepy>=0.23,<0.24",
    # v1 결과(TF-IDF 키워드)를 만든 버전대. 올릴 때는 캐시 재생 비교로 평가 기준이 같은지 먼저 확인한다
    "scikit-learn>=1.8,<1.9",
    # ── research 전용 (coverage_lab · experiments · reports)
    "langchain-openai>=1.3",
    "python-dotenv>=1.0",
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
    "ipykernel",
    "nbconvert",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live: 실제 LLM API 를 부르는 테스트 (과금). 기본 실행에서 빼고 `pytest -m live` 로 따로 돌린다
markers = ["live: 실제 LLM API 를 호출한다 (과금)"]
addopts = "-m 'not live'"

# backend/pyproject.toml 과 같은 규칙
[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 코드 줄 길이는 ruff format 이 맞춘다. 남는 긴 줄은 한국어 주석 · 문자열(한글은 폭 2칸)이고,
# 프롬프트 · LLM 출력 스키마의 문자열은 캐시 키(설정 해시)에 들어가 원문 그대로 둬야 해서 E501 은 끈다
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["script_coverage", "coverage_lab"]
