[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 배포 이름. import 패키지는 chat_agent_lab(연구 전용: 서비스 계층 대역 · 가짜 BE · 평가) 하나다.
#   코어는 서비스 패키지 pitch_coach_ai.features.chat_agent 에 있고(기능 문서 4-1), 여기서는 편집 가능 설치로 가져다 쓴다.
name = "chat-agent"
version = "0.1.0"
description = "Pitch Coach chat coach agent - research (core + lab)"
# service 가 쓸 Python 버전(3.12)에서 검증한다
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
    #    pitch-coach-ai: 대화 에이전트 코어(features.chat_agent)와, 가짜 BE 가 다시 평가(REASSESS)에서 부르는
    #    실제 리뷰 코드(review_take)
    "pitch-coach-ai",
    #    openai: 서비스 도구 호출 LLM(pitch_coach_ai.common.llm.ToolLlmClient)을 평가 · live 에서 부른다. 3.x
    "openai>=3.29",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.uv.sources]
pitch-coach-ai = { path = "../../service", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["chat_agent_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live: 실제 LLM API 를 부르는 평가 · 시험 (과금). slow: 오래 걸리는 시험(부하 등).
# 둘 다 기본 실행에서 빼고 README 의 명령으로 요청할 때만 돌린다 (기능 문서 10-5)
markers = [
    "live: 실제 LLM API 를 호출한다 (과금)",
    "slow: 오래 걸린다 (부하 등)",
    "prefetch: 조사 흐름(코드가 먼저 읽기)을 켠 시험 — tests/conftest.py (서비스 tests/unit/chat_agent/conftest.py 와 같은 규칙)",
    "no_prefetch: prefetch 를 단 파일 안에서 조사 흐름을 끄는 시험(모델 호출 순서 대본) — tests/conftest.py",
    "model_signals: 신호를 모델에게 묻던 이전 동작(code_signal_responses=False)으로 보는 시험 — tests/conftest.py",
    "reassess_targets: 기준(targets) 다시 평가를 켠 시험(서비스 기본은 막음) — tests/conftest.py",
]
addopts = "-m 'not live and not slow'"

# backend/pyproject.toml 과 같은 규칙
[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 남는 긴 줄은 한국어 docstring · 주석 · 문구(한글은 폭 2칸)와 모델 · 화면에 그대로 가는 글이다.
# 코드 줄은 ruff format 이 100 안으로 맞춘다(서비스 pyproject 의 script_coverage · evaluation_criteria 와 같은 규칙)
"src/**" = ["E501"]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["chat_agent_lab"]
