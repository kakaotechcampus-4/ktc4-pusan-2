[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 배포 이름. import 패키지는 review 하나다.
#   review — 리뷰 코어. 나중에 ai/service 의 features/review/ 로 폴더째 옮긴다
name = "review-agent"
version = "1.0.0"
description = "Pitch Coach review agent - research (core)"
# service 가 쓸 Python 버전(3.12)에서 검증한다
requires-python = ">=3.12"
dependencies = [
    # 코어(review)가 쓰는 것은 pydantic 하나뿐이다. service 로 옮길 때 이것만 가져간다.
    # 2차 LLM 단계도 LLM 클라이언트는 코어가 만들지 않고 인자로 받는다
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review = ["examples/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# backend/pyproject.toml · coach-agent 와 같은 규칙
[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["review"]
