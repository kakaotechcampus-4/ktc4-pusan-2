[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 코어 script_parser 는 나중에 ai/service 의 features/script_parser/ 로 폴더째 옮긴다
name = "script-parser"
version = "1.0.0"
description = "발표 대본 장 나누기 · 키워드 · terms 추출 (research)"
# service 가 쓸 Python 버전(3.12)에서 검증한다
requires-python = ">=3.12"
dependencies = [
    # ── 코어(script_parser)가 쓰는 것은 pydantic 하나뿐이다. LLM 은 인자로 받는다
    "pydantic>=2.14",
    # ── research 전용 (run.py 의 build_llm)
    "langchain-openai>=1.7",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# live: 실제 LLM API 를 부르는 테스트 (과금). 기본 실행에서 빼고 `pytest -m live` 로 따로 돌린다
markers = ["live: 실제 LLM API 를 호출한다 (과금)"]
addopts = "-m 'not live'"
