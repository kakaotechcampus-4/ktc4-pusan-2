[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 배포 이름. import 패키지는 volume 하나다 — 나중에 ai/service 의 features/volume/ 로 폴더째 옮긴다
name = "volume-analysis"
version = "1.0.0"
description = "Pitch Coach volume and silence judge - research"
# service 가 쓸 Python 버전(3.12)에서 검증한다
requires-python = ">=3.12"
dependencies = [
    # 판정 코어(volume)가 쓰는 것은 pydantic 하나뿐이다. service 로 옮길 때 이것만 가져간다
    "pydantic>=2.13",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 계약 테스트가 읽는 입력 · 출력 예시
volume = ["examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# backend/pyproject.toml 과 같은 규칙
[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 진입 함수의 기본값 config: Config = Config(). Config 는 frozen 이라 공유해도 바뀌지 않는다
"src/volume/core.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["volume"]
