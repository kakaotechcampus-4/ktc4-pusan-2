[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-analysis"
version = "1.0.0"
description = "Pitch Coach volume and silence judge - research"
# service 가 쓸 Python 버전(3.12)에서 검증한다
requires-python = ">=3.12"
dependencies = [
    # 판정 모듈은 AI 서비스(ai/service)의 pitch_coach_ai.features.volume 에 있고, 서비스를 editable 로 설치해
    # 그대로 import 한다(원본은 서비스 한 곳, examples 포함). 판은 서비스 uv.lock 과 같게 맞춘다
    "pitch-coach-ai",
]

[tool.uv.sources]
pitch-coach-ai = { path = "../../service", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.16",
]

# 이 폴더에는 import 패키지가 없다(판정 모듈 · 테스트는 서비스, 평가 도구는 아직 없음). 빈 src/ 를 찾지 않게 한다
[tool.setuptools]
packages = []

# backend/pyproject.toml 과 같은 규칙
[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pitch_coach_ai"]
