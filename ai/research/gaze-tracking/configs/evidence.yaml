# 1 s gaze records: frame decisions cut into slices on a grid anchored at the first frame
# (gaze_lab.evidence.gaze, web/src/engine/evidence.ts). Engine values only -- what the server
# makes of the records is gaze.config.GazeConfig. All values are initial, not measured.

# One record per slice: decided by majority of its frames (UNMEASURED below min_frames).
slice_ms: 1000
min_frames_per_slice: 4
slice_vote_threshold: 0.6
