[project]
name = "pitch-coach-ai"
version = "0.1.0"
description = "Pitch Coach AI 서비스 — AI 기능을 BE에 HTTP API로 연다"
readme = "README.md"
# 연구 환경(일부는 3.13 미만)이 이 서비스를 설치해 코어를 import 하므로 3.12 에 맞춘다
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "kiwipiepy>=0.23,<0.24",
    "langchain-openai>=1.7.1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.8,<1.9",
    "uvicorn[standard]>=0.54.0",
]

# 로컬 uv sync 가 이 프로젝트를 .venv 에 편집 가능 설치해 `import pitch_coach_ai` 가 되게 한다.
# 이미지에서는 설치하지 않고 PYTHONPATH 로 찾는다 (Dockerfile)
[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# backend/pyproject.toml 과 같은 규칙
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pyflakes·pycodestyle, I: import 정렬, UP: 최신 문법, B: 흔한 버그, SIM: 단순화
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 대본 전달도: 프롬프트 · LLM 출력 스키마의 문자열은 캐시 키(설정 해시)에 들어가 원문 그대로 둬야 해서
# 줄을 나누지 않는다. 남는 긴 줄은 한국어 주석 · 문자열(한글은 폭 2칸)이다 (연구 폴더와 같은 규칙)
"src/pitch_coach_ai/features/script_coverage/**" = ["E501"]
"tests/unit/script_coverage/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live: 실제 LLM 을 부르는 테스트(과금), slow: 오래 걸리는 규모 측정. 둘 다 기본 실행에서 빼고
# `pytest -m live` · `pytest -m slow` 로만 돈다.
# CI 는 키 없이 기본 실행만 한다
markers = [
    "live: 실제 LLM API 를 호출한다 (과금)",
    "slow: 오래 걸리는 규모 측정 (기본 실행에서 빼고 `pytest -m slow` 로 돈다)",
]
addopts = "-m 'not live and not slow'"
filterwarnings = [
    # 스트리밍 + 구조화 출력에서 LangChain 이 내는 직렬화 경고. 결과는 정상이고 서버에서는
    # common/llm.py 가 끈다. pytest 는 테스트마다 경고 필터를 다시 깔아 여기에도 둔다
    "ignore:Pydantic serializer warnings:UserWarning",
]
