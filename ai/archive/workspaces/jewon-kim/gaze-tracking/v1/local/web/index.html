<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시선 인식 · 로컬 데모</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%225%22 fill=%22%23E8532A%22/%3E%3C/svg%3E"
    />
  </head>
  <body data-stage="intro">
    <!--
      This page stands in for the frontend's page.  Only the box #stage is ours:
      the camera view (src/camera) fills it with the camera picture and draws
      everything inside it.  The box's size and place, going full screen, the
      start card and the dev panel are the page's -- the frontend's -- to decide.
      ?box shows the view in a 16:9 card instead of the whole window.
    -->
    <main class="host">
      <div class="stage" id="stage"></div>
      <section class="panel" id="panel" aria-live="polite"></section>
    </main>
    <div class="toast" id="toast" role="alert"></div>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
