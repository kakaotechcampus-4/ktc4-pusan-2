services:
  be:
    restart: unless-stopped
    image: ${IMAGE_REPO:-pitch-coach}:be-${IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis

  fe:
    restart: unless-stopped
    image: ${IMAGE_REPO:-pitch-coach}:fe-${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - ../frontend/.env

  caddy:
    image: caddy:2.6.4-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - be
      - fe
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
  
  db:
    restart: unless-stopped
    image: postgres:17-alpine
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:6379:6379"
    command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  db_data:
  redis_data:
