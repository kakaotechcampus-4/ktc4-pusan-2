# 이미지 기반 실행 파일 — docker-compose.yml 과 구성은 같고, 빌드 대신 **이미지를 받아서** 띄운다.
#
# 왜 별도 파일인가:
#   한 서비스에 `build:` 와 `image:` 가 같이 있으면 Compose 는 이미지가 로컬에 없을 때
#   그 이름으로 **빌드를 시도**한다. EC2 처럼 빌드하면 안 되는 곳에서 이게 사고가 된다.
#   docker-compose.yml 을 상속하지 않고 독립 파일로 두면 그 함정이 원천적으로 없다.
#
# ⚠️ 현재 be/fe/ai 는 **공개 테스트 이미지**(traefik/whoami)다. 우리 앱이 아니다.
#   요청을 받으면 자기 이름을 응답할 뿐이라, Caddy 가 어느 서비스로 보냈는지 눈으로 확인된다.
#   실제 이미지가 생기면 세 서비스의 `image:` (와 불필요해진 `command:`) 만 교체하면 된다.
#   예: image: <사용자명>/pitch-coach:be-latest
#       Docker Hub 는 GHCR 과 달리 user/repo/service 같은 중첩 경로를 지원하지 않아
#       repo 1개 + `be-` / `fe-` / `ai-` 태그로 서비스를 구분한다.
#
# 실행:
#   docker compose -f docker-compose.image.yml -f docker-compose.dev.yml up -d

services:
  be:
    restart: unless-stopped
    image: traefik/whoami
    command: ["--port", "8000", "--name", "backend"]
    env_file:
      - path: ../backend/.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"

  fe:
    restart: unless-stopped
    image: traefik/whoami
    command: ["--port", "3000", "--name", "frontend"]
    env_file:
      - path: ../frontend/.env
        required: false

  ai:
    restart: unless-stopped
    image: traefik/whoami
    command: ["--port", "8001", "--name", "aiagent"]
    env_file:
      - path: ../aiagent/.env
        required: false

  caddy:
    image: caddy:2.6.4-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - be
      - fe
      - ai
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
